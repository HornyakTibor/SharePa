<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline – SharePa</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f3f5;font-family:Montserrat,system-ui,sans-serif;color:#1A3453;padding:24px;box-sizing:border-box}
  .card{max-width:420px;background:#fff;border-radius:28px;padding:36px 28px;text-align:center;box-shadow:0 12px 40px rgba(9,16,29,.08)}
  .mark{display:block;width:64px;height:64px;margin:0 auto 18px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:#4a5468;line-height:1.6;margin:0 0 22px}
  button{border:0;border-radius:999px;background:#5833A7;color:#fff;font:700 15px Montserrat,system-ui,sans-serif;padding:14px 26px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="4" fill="#5833A7"/><path d="M7 14C7 10.6863 9.68629 8 13 8H29C29 11.3137 26.3137 14 23 14H7Z" fill="#E2DCF3"/><path opacity="0.66" d="M7 15H23C26.3137 15 29 17.6863 29 21H13C9.68629 21 7 18.3137 7 15Z" fill="#E2DCF3"/><path opacity="0.33" d="M7 28C7 24.6863 9.68629 22 13 22H29C29 25.3137 26.3137 28 23 28H7Z" fill="#E2DCF3"/></svg>
    <h1>You're offline</h1>
    <p>SharePa needs an internet connection to show your rides. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
